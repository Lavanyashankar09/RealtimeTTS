<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161712">
  <title>Voice Foundry | Local SpeechT5 Studio</title>
  <style>
    :root {
      --ink: #171812;
      --paper: #f4f0e6;
      --paper-deep: #e8e1d2;
      --signal: #f0522f;
      --signal-dark: #ad3019;
      --lime: #c9e76c;
      --muted: #6c6a60;
      --line: rgba(23, 24, 18, 0.18);
      --white: #fffdf7;
      --shadow: 0 24px 70px rgba(33, 29, 19, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 24, 18, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 24, 18, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: "Avenir Next", "Century Gothic", sans-serif;
    }

    button, textarea { font: inherit; }

    button:focus-visible, textarea:focus-visible, audio:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 3px;
    }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow, .label, .meta, .status-copy, .counter {
      font-family: "SFMono-Regular", Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .eyebrow { margin: 0 0 12px; font-size: 0.74rem; font-weight: 500; }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2.7rem, 7vw, 6.2rem);
      line-height: 0.88;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .header-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .latency {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.62);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .latency-label { opacity: 0.55; }
    .latency-value { font-size: 0.95rem; font-weight: 700; }
    .latency-factor { opacity: 0.55; }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
      margin-top: 4px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.62);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b8b3a7;
      box-shadow: 0 0 0 4px rgba(184, 179, 167, 0.18);
    }

    .connection[data-state="connected"] .connection-dot {
      background: #5a9b40;
      box-shadow: 0 0 0 4px rgba(90, 155, 64, 0.16);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.72fr);
      gap: 28px;
      margin-top: 28px;
    }

    .editor, .playback {
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, 0.86);
      box-shadow: var(--shadow);
    }

    .editor { padding: clamp(24px, 4vw, 48px); }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .label { margin: 0; font-size: 0.75rem; font-weight: 500; }
    .counter { color: var(--muted); font-size: 0.7rem; }
    .counter.at-limit { color: var(--signal-dark); }

    textarea {
      display: block;
      width: 100%;
      min-height: 300px;
      resize: vertical;
      padding: 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font-size: clamp(1.35rem, 2.7vw, 2.2rem);
      line-height: 1.38;
      letter-spacing: 0;
    }

    textarea::placeholder { color: #9c998e; }
    textarea:focus { outline: 0; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    button, .download {
      min-height: 46px;
      padding: 12px 17px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    button:hover:not(:disabled), .download:hover { transform: translateY(-2px); }
    button:disabled, .download[aria-disabled="true"] { cursor: not-allowed; opacity: 0.38; transform: none; pointer-events: none; }

    .primary {
      min-width: 190px;
      border-color: var(--signal);
      color: var(--white);
      background: var(--signal);
    }

    .primary:hover:not(:disabled) { background: var(--signal-dark); }
    .quiet { border-color: var(--line); }

    .playback {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      overflow: hidden;
      color: var(--white);
      background: var(--ink);
    }

    .visualizer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      padding: 32px;
      overflow: hidden;
      background: var(--signal);
    }

    .visualizer::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.17;
      background: repeating-linear-gradient(90deg, transparent 0 17px, var(--ink) 18px 19px);
    }

    .wave {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      height: 120px;
    }

    .wave span {
      width: 7px;
      height: var(--height);
      min-height: 10px;
      background: var(--ink);
      transform-origin: center;
    }

    .playback.is-busy .wave span {
      animation: pulse 900ms ease-in-out infinite alternate;
      animation-delay: calc(var(--index) * -65ms);
    }

    @keyframes pulse { to { transform: scaleY(0.22); } }

    .playback-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 28px;
    }

    .meta { margin: 0 0 14px; color: var(--lime); font-size: 0.7rem; }
    #statusHeading { margin: 0; font-size: 1.65rem; line-height: 1.12; }
    .status-copy { min-height: 44px; margin: 10px 0 24px; color: #b9b8ae; font-size: 0.67rem; line-height: 1.6; }
    .status-copy.error { color: #ff9b82; }

    audio { width: 100%; margin-top: auto; }

    .transport {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .transport button, .transport .download { display: grid; place-items: center; border-color: #55564f; color: var(--white); }

    .footnote {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 22px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.67rem;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .reveal { animation: reveal 520ms cubic-bezier(.2,.8,.2,1) both; }
    .workspace.reveal { animation-delay: 80ms; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 22px; }
      header { display: block; }
      .connection { margin-top: 22px; }
      .workspace { grid-template-columns: 1fr; }
      .editor { padding: 24px; }
      textarea { min-height: 240px; }
      .playback { min-height: 520px; }
      .footnote { display: block; }
    }

    @media (max-width: 460px) {
      h1 { font-size: 2.6rem; }
      .actions button { flex: 1 1 calc(50% - 10px); }
      .actions .primary { flex-basis: 100%; }
      .transport { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="reveal">
      <div>
        <p class="eyebrow">Realtime streaming TTS / SpeechT5</p>
        <h1>Voice<br>Foundry</h1>
      </div>
      <div class="header-status">
        <div id="latency" class="latency" role="status" aria-live="polite">
          <span class="latency-label">First sound</span>
          <span id="latencyValue" class="latency-value">&mdash;</span>
          <span id="latencyFactor" class="latency-factor"></span>
        </div>
        <div id="connection" class="connection" data-state="connecting" role="status" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionText">Connecting</span>
        </div>
      </div>
    </header>

    <section class="workspace reveal" aria-label="Text-to-speech workspace">
      <div class="editor">
        <div class="section-head">
          <label class="label" for="textInput">Source text</label>
          <span id="counter" class="counter">0 / 500</span>
        </div>
        <textarea id="textInput" maxlength="500" placeholder="Start typing and it speaks as you go..." spellcheck="true"></textarea>
        <div class="actions">
          <button id="stopButton" class="primary" type="button" disabled>Stop</button>
          <button id="copyButton" class="quiet" type="button">Copy text</button>
          <button id="clearButton" class="quiet" type="button">Clear</button>
        </div>
      </div>

      <aside id="playback" class="playback" aria-label="Playback console">
        <div class="visualizer" aria-hidden="true">
          <div class="wave">
            <span style="--height: 30%; --index: 1"></span><span style="--height: 58%; --index: 2"></span>
            <span style="--height: 94%; --index: 3"></span><span style="--height: 46%; --index: 4"></span>
            <span style="--height: 78%; --index: 5"></span><span style="--height: 100%; --index: 6"></span>
            <span style="--height: 64%; --index: 7"></span><span style="--height: 38%; --index: 8"></span>
            <span style="--height: 82%; --index: 9"></span><span style="--height: 54%; --index: 10"></span>
            <span style="--height: 24%; --index: 11"></span>
          </div>
        </div>
        <div class="playback-body">
          <p class="meta">Output monitor</p>
          <h2 id="statusHeading">Ready to render</h2>
          <p id="statusCopy" class="status-copy" aria-live="polite">Your generated WAV will appear here.</p>
          <audio id="audioPlayer" controls preload="metadata"></audio>
          <div class="transport">
            <button id="replayButton" type="button" disabled>Replay</button>
            <a id="downloadButton" class="download" href="#" download="voice-foundry.wav" aria-disabled="true">Download WAV</a>
          </div>
        </div>
      </aside>
    </section>

    <div class="footnote reveal">
      <span>Runs locally. Speech streams as you type; nothing leaves your machine.</span>
      <span>500 character maximum / Native 16 kHz WAV</span>
    </div>
  </main>

  <script>
    (() => {
      const MAX_LENGTH = 500;
      const DEBOUNCE_MS = 300;
      // Pausing briefly speaks completed words; a longer pause flushes whatever
      // half-typed word is left so it never gets stranded.
      const FLUSH_MS = 1200;
      const ENDS_COMPLETE = /[\s.,;:!?]$/;
      const elements = {
        text: document.getElementById("textInput"),
        counter: document.getElementById("counter"),
        connection: document.getElementById("connection"),
        connectionText: document.getElementById("connectionText"),
        stop: document.getElementById("stopButton"),
        copy: document.getElementById("copyButton"),
        clear: document.getElementById("clearButton"),
        playback: document.getElementById("playback"),
        heading: document.getElementById("statusHeading"),
        status: document.getElementById("statusCopy"),
        audio: document.getElementById("audioPlayer"),
        replay: document.getElementById("replayButton"),
        download: document.getElementById("downloadButton"),
        latencyValue: document.getElementById("latencyValue"),
        latencyFactor: document.getElementById("latencyFactor"),
      };

      let socket;
      let reconnectTimer;
      let debounceTimer;
      let flushTimer;
      let activeRequests = new Set();
      // Per-request timing, so the header can show how long the first audio
      // actually took to come back rather than a number from a README.
      let sentAt = new Map();
      let firstSoundMs = null;
      let takeStartedAt = null;
      let takeAudioSeconds = 0;
      let lastSpokenText = "";
      let audioUrl = null;

      let audioContext = null;
      let nextStartTime = 0;
      let activeSources = [];
      let chunkBuffers = [];
      let decodeChain = Promise.resolve();

      function websocketUrl() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        return `${protocol}//${window.location.host}/ws`;
      }

      function setConnection(state, label) {
        elements.connection.dataset.state = state;
        elements.connectionText.textContent = label;
        updateControls();
      }

      function setStatus(heading, message, error = false) {
        elements.heading.textContent = heading;
        elements.status.textContent = message;
        elements.status.classList.toggle("error", error);
      }

      function updateCounter() {
        const length = elements.text.value.length;
        elements.counter.textContent = `${length} / ${MAX_LENGTH}`;
        elements.counter.classList.toggle("at-limit", length === MAX_LENGTH);
      }

      function showLatency(ms, factor) {
        elements.latencyValue.textContent = ms === null ? "\u2014" : `${Math.round(ms)} ms`;
        elements.latencyFactor.textContent = factor ? `${factor.toFixed(2)}x realtime` : "";
      }

      function updateControls() {
        const busy = activeRequests.size > 0;
        const playing = activeSources.length > 0 || !elements.audio.paused;
        const hasAudio = Boolean(audioUrl);
        elements.stop.disabled = !busy && !playing;
        elements.replay.disabled = !hasAudio;
        elements.download.setAttribute("aria-disabled", String(!hasAudio));
      }

      function connect() {
        // A second socket would auto-submit its own copy of the text and you
        // would hear the passage twice, overlapping.
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
        window.clearTimeout(reconnectTimer);
        setConnection("connecting", "Connecting");
        socket = new WebSocket(websocketUrl());
        socket.addEventListener("open", () => setConnection("connected", "Local server online"));
        socket.addEventListener("message", event => handleMessage(event.data));
        socket.addEventListener("close", () => {
          setConnection("disconnected", "Server offline / retrying");
          reconnectTimer = window.setTimeout(connect, 2000);
        });
        socket.addEventListener("error", () => socket.close());
      }

      function ensureContext() {
        if (!audioContext) {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          audioContext = new Ctor();
        }
        if (audioContext.state === "suspended") {
          audioContext.resume().then(updateControls, () => {});
        }
        return audioContext;
      }

      // Browsers keep an AudioContext suspended until the page sees a real
      // gesture. With no Generate button to click, nothing else guarantees one.
      function unlockAudio() {
        const context = ensureContext();
        context.resume().then(() => {
          if (context.state === "running") updateControls();
        }, () => {});
      }

      function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      // The streamed queue and the <audio> element are two separate ways to
      // play the same speech. Whenever one starts, the other has to be silenced
      // or you hear the passage twice, overlapping.
      function stopScheduled() {
        activeSources.forEach(source => {
          try { source.stop(); } catch { /* already ended */ }
        });
        activeSources = [];
        nextStartTime = 0;
      }

      function stopPlayback() {
        stopScheduled();
        elements.audio.pause();
      }

      function releaseAudio() {
        elements.audio.removeAttribute("src");
        elements.audio.load();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = null;
        elements.download.removeAttribute("href");
      }

      // 16-bit PCM WAV so the finished take can be replayed and downloaded as
      // one file, even though it arrived as many separate chunks.
      function encodeWav(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeText = (offset, text) => {
          for (let index = 0; index < text.length; index += 1) {
            view.setUint8(offset + index, text.charCodeAt(index));
          }
        };

        writeText(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeText(8, "WAVEfmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeText(36, "data");
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let index = 0; index < samples.length; index += 1) {
          const clamped = Math.max(-1, Math.min(1, samples[index]));
          view.setInt16(offset, clamped * 0x7fff, true);
          offset += 2;
        }
        return new Blob([buffer], { type: "audio/wav" });
      }

      function finalizeTake() {
        if (!chunkBuffers.length || !audioContext) return;
        const total = chunkBuffers.reduce((sum, buffer) => sum + buffer.length, 0);
        const merged = new Float32Array(total);
        let offset = 0;
        chunkBuffers.forEach(buffer => {
          merged.set(buffer.getChannelData(0), offset);
          offset += buffer.length;
        });
        releaseAudio();
        audioUrl = URL.createObjectURL(encodeWav(merged, audioContext.sampleRate));
        elements.audio.src = audioUrl;
        elements.download.href = audioUrl;
      }

      async function playChunk(message) {
        if (!activeRequests.has(message.request_id)) return;
        const context = ensureContext();
        const decoded = await context.decodeAudioData(base64ToBytes(message.audio).buffer);
        if (!activeRequests.has(message.request_id)) return;

        chunkBuffers.push(decoded);
        takeAudioSeconds += decoded.duration;
        if (firstSoundMs === null) {
          const started = sentAt.get(message.request_id);
          if (started !== undefined) {
            firstSoundMs = performance.now() - started;
            showLatency(firstSoundMs, null);
          }
        }
        const source = context.createBufferSource();
        source.buffer = decoded;
        source.connect(context.destination);
        // Appended speech lands after whatever is still queued, so added words
        // continue the passage instead of restarting it.
        const startAt = Math.max(context.currentTime, nextStartTime);
        source.start(startAt);
        nextStartTime = startAt + decoded.duration;
        activeSources.push(source);
        source.addEventListener("ended", () => {
          activeSources = activeSources.filter(item => item !== source);
          updateControls();
        });
        if (context.state === "suspended") {
          setStatus("Click to enable audio", "Your browser blocked autoplay. Click anywhere and the queued speech will start.");
        }
        updateControls();
      }

      // Every decode goes through one chain so chunks can never play out of
      // order. The catch is what stops a single failure poisoning the chain
      // and silently killing all later playback.
      function enqueueDecode(work) {
        decodeChain = decodeChain.then(work).catch(error => {
          console.error("RealtimeTTS playback", error);
          setStatus("Playback error", "A chunk of audio could not be played.", true);
        });
      }

      function handleMessage(rawMessage) {
        let message;
        try {
          message = JSON.parse(rawMessage);
        } catch {
          setStatus("Protocol error", "The server returned an unreadable response.", true);
          return;
        }

        if (!activeRequests.has(message.request_id)) return;

        if (message.type === "status") {
          const title = message.status === "loading" ? "Loading the voice" : "Streaming the waveform";
          setStatus(title, message.message);
          return;
        }

        if (message.type === "error") {
          setStatus("Generation failed", message.message || "Please try again.", true);
          activeRequests.delete(message.request_id);
          if (!activeRequests.size) elements.playback.classList.remove("is-busy");
          updateControls();
          return;
        }

        if (message.type === "audio_chunk" && message.audio) {
          enqueueDecode(() => playChunk(message));
          return;
        }

        if (message.type === "done") {
          enqueueDecode(() => {
            if (!activeRequests.delete(message.request_id)) return;
            sentAt.delete(message.request_id);
            if (activeRequests.size) return;
            finalizeTake();
            const wall = takeStartedAt === null ? 0 : (performance.now() - takeStartedAt) / 1000;
            const factor = takeAudioSeconds > 0 ? wall / takeAudioSeconds : null;
            showLatency(firstSoundMs, factor);
            elements.playback.classList.remove("is-busy");
            setStatus("Voice ready", "Keep typing and the new words are queued on the end.");
            updateControls();
          });
        }
      }

      function submit(flush = true) {
        const full = elements.text.value.trim();
        if (!full || !socket || socket.readyState !== WebSocket.OPEN) return;
        if (full === lastSpokenText) return;

        // Typing more onto the end should extend the passage. Editing what was
        // already spoken has to start over, since that audio is already queued.
        const isAppend = Boolean(lastSpokenText) && full.startsWith(lastSpokenText);

        let target = full;
        if (isAppend && !flush && !ENDS_COMPLETE.test(elements.text.value)) {
          const lastSpace = full.lastIndexOf(" ");
          target = lastSpace > lastSpokenText.length ? full.slice(0, lastSpace) : lastSpokenText;
        }
        if (target === lastSpokenText) return;

        const payload = isAppend ? target.slice(lastSpokenText.length).trim() : target;
        lastSpokenText = target;
        if (!payload) return;

        if (!isAppend) {
          stopPlayback();
          chunkBuffers = [];
          activeRequests.clear();
        }

        const requestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
        activeRequests.add(requestId);
        sentAt.set(requestId, performance.now());
        if (!isAppend) {
          firstSoundMs = null;
          takeStartedAt = performance.now();
          takeAudioSeconds = 0;
          showLatency(null, null);
        }
        ensureContext();
        elements.playback.classList.add("is-busy");
        setStatus("Listening ahead", isAppend ? "Queueing the new words." : "Sending your text to the local SpeechT5 engine.");
        socket.send(JSON.stringify({
          request_id: requestId,
          text: payload,
          mode: isAppend ? "append" : "replace",
        }));
        updateControls();
      }

      function scheduleSubmit() {
        window.clearTimeout(debounceTimer);
        window.clearTimeout(flushTimer);
        debounceTimer = window.setTimeout(() => submit(false), DEBOUNCE_MS);
        flushTimer = window.setTimeout(() => submit(true), FLUSH_MS);
      }

      function stop() {
        window.clearTimeout(debounceTimer);
        window.clearTimeout(flushTimer);
        stopPlayback();
        activeRequests.clear();
        sentAt.clear();
        // Everything queued is gone, so the next edit has to re-speak the lot.
        lastSpokenText = "";
        elements.playback.classList.remove("is-busy");
        // Keep the audio generated so far replayable instead of discarding it.
        enqueueDecode(() => {
          finalizeTake();
          setStatus(
            "Stopped",
            audioUrl
              ? "Stopped. The speech generated so far is still there to replay or download."
              : "Stopped before any audio was ready."
          );
          updateControls();
        });
      }

      async function copyText() {
        try {
          await navigator.clipboard.writeText(elements.text.value);
          setStatus("Text copied", "The source text is on your clipboard.");
        } catch {
          setStatus("Copy unavailable", "Clipboard access was denied by the browser.", true);
        }
      }

      function clearAll() {
        window.clearTimeout(debounceTimer);
        window.clearTimeout(flushTimer);
        stopPlayback();
        releaseAudio();
        activeRequests.clear();
        sentAt.clear();
        firstSoundMs = null;
        takeAudioSeconds = 0;
        showLatency(null, null);
        lastSpokenText = "";
        chunkBuffers = [];
        elements.playback.classList.remove("is-busy");
        elements.text.value = "";
        updateCounter();
        setStatus("Canvas cleared", "Write a new passage when you are ready.");
        updateControls();
        elements.text.focus();
      }

      document.addEventListener("pointerdown", unlockAudio, { once: true });
      document.addEventListener("keydown", unlockAudio, { once: true });

      elements.text.addEventListener("input", () => {
        updateCounter();
        ensureContext();
        scheduleSubmit();
      });
      elements.stop.addEventListener("click", stop);
      elements.copy.addEventListener("click", copyText);
      elements.clear.addEventListener("click", clearAll);
      elements.replay.addEventListener("click", () => {
        stopPlayback();
        elements.audio.currentTime = 0;
        elements.audio.play();
      });
      elements.audio.addEventListener("play", () => {
        stopScheduled();
        updateControls();
      });
      elements.audio.addEventListener("pause", updateControls);
      elements.audio.addEventListener("ended", updateControls);
      window.addEventListener("beforeunload", () => {
        window.clearTimeout(reconnectTimer);
        window.clearTimeout(debounceTimer);
        window.clearTimeout(flushTimer);
        if (socket) socket.close();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
      });

      updateCounter();
      updateControls();
      connect();
    })();
  </script>
</body>
</html>
